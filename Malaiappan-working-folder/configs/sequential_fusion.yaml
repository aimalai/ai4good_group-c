defaults:
  - _self_

output_root: runs
run_name: sequential_fusion_spatial_patch_optimized
seed: 42

trainer:
  max_epochs: 10
  accelerator: auto
  devices: 1
  precision: 32-true
  limit_train_batches: 1.0
  gradient_clip_val: 1.0
  early_stopping_patience: 3
  early_stopping_monitor: val/loss
  checkpoint_monitor: val/loss

logger:
  kind: wandb
  entity: null
  project: forest-disturbance-exploration
  offline: false

data:
  root: /zfs/ai4good/datasets/forest_disturbance
  fold: 0
  label_mapping: configs/label_mapping.yaml
  sensors: ["s1", "s2"]
  target_sensors: ["s2"]
  reader: zarr
  image_size: 3
  days_before: 30
  years_context: 1
  days_context: 15
  sampling_alpha: 0.5
  batch_size: 32
  num_workers: 32

model:
  name: sequential_fusion
  frame_dim: 32
  hidden_dim: 64
  num_layers: 1
  dropout: 0.1

loss: {}

optimizer:
  lr: 0.001
  weight_decay: 0.0001

evaluation:
  horizons_days: [14, 30, 60, 365]
  threshold: 0.5
